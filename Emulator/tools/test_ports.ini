; A second emulator next to the running one, for replay tests (tools/replay.py):
;   .venv/bin/python -m dcemu -c tools/test_ports.ini -q
; Every service on 111xx; set the one under test to native (ZoneServer port 0) or proxied.
[emulator]
listen = 127.0.0.1
log_dir = logs/test
control_port = 11199

[services]
auth = 11105 0 56
lobby = 11111 0 56
game = 11121 0 56
area = 11131 12031 0
barea = 11141 12041 0
ranking = 11151 0 56

[native]
delete_wait_days = 0
