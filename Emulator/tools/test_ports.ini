; A second emulator next to the running one, for replay tests (tools/replay.py):
;   .venv/bin/python -m dcemu -c tools/test_ports.ini -q
; Every service on 112xx (111xx is the 2016 server); set the one under test to native (ZoneServer port 0) or proxied.
[emulator]
listen = 127.0.0.1
log_dir = logs/test
control_port = 11299

[services]
auth = 11205 0 56
lobby = 11211 0 56
game = 11221 0 56
area = 11231 12031 0
barea = 11241 12041 0
ranking = 11251 0 56

[native]
delete_wait_days = 0
