; Optional 2016 test instance. The live emulator.ini remains version 2011.
; Requires tools.prepare2016 data and a fresh SKDB2016TEST database (schema from db/).
;   .venv/bin/python -m dcemu -c tools/test2016.ini -q
;   .venv/bin/python -m tools.client2016 launch
[emulator]
listen = 127.0.0.1
log_dir = logs/2016
control_port = 11199

[client]
version = 2016
max_level_2016 = 100
data_2016 = server_data_2016

[database]
name = SKDB2016TEST
server_id = 2016

[native]
server_list = server_data_2016/test_serverlist.txt

[services]
auth = 11105 0 56
lobby = 11111 0 56
game = 11121 0 56
area = 11131 0 0
barea = 11141 0 0
ranking = 11151 0 56
