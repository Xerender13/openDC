[emulator]
listen = 0.0.0.0        ; where the 2011 client connects
upstream = 127.0.0.1    ; only for proxied services: the 2008 ZoneServer (../Server2008, not needed when all are native)
log_dir = logs
control_port = 11099   ; GM commands, 127.0.0.1 only (tools/gmctl.py: kick, block, ban); 0 = off

[client]
; The client build this server is for: 2011 (the US / EU clients) or 2016 (the 2016 US client, "DriftCity Dev Ed").
; One build per emulator instance; login does not distinguish builds. With 2016 the [2016] section at the end of
; this file replaces the settings it names (its own ports, database and data). 2016 support is experimental.
version = 2016
; 2016 only: advertised level limit and server progression cap (2011 rules are unchanged).
max_level_2016 = 100
; Separate client tables, prepared with: python -m tools.prepare2016
data_2016 = server_data_2016

[services]
; name = client port, ZoneServer port, handshake bytes per direction (a 56-byte key
; exchange on auth/lobby/game/ranking, none on area/barea; see dcemu/protocol.py)
; the client ports are the ones the 2011 client and server_data/serverlist.txt use
; native (the emulator is the server): ZoneServer port 0
auth  = 11005 0 56
lobby = 11011 0 56
game  = 11021 0 56
area  = 11031 0 0
barea = 11041 0 0
ranking = 11051 0 56
; proxied to the 2008 server instead: auth = 11005 12005 56, lobby = 11011 12011 56
; native barea with race traffic (dcemu/native/race.py, not yet tried with the real client): barea = 11041 0 0

[database]          ; SQL Server (docker-compose.yml here: service db, published on 127.0.0.1:14330)
host = 127.0.0.1
port = 14330
user = sa
password = z0ne!server
name = SKDBTW
server_id = 100

[auth]
; 1 = logging in with an ID that has no account creates the account with the password typed (not empty;
; IDs: 1-32 characters, letters, digits and - _ .), 0 = unknown IDs are refused ("ID does not exist")
auto_register = 1

[nation]
; the client's nation (dcemu/native/nation.py): auto = what each client says (the EU client sends it, 7 de / 8 eng /
; 9 fr / 10 es; a client that says nothing is the US client, 1), or a number for every client
client = auto
; the nations that may log in: all, or a list of us / eu / eu_de / eu_eng / eu_fr / eu_es / numbers (e.g. "eu",
; "eu_eng", "1 8"). A client of another nation gets "Authentication system abnormal.(99)" and no account is made.
; all: the US client (Client US) and the EU client (Client EU) both play here
allow = all
; rules by nation group (us / eu), 1 = on, 0 = off:
;   part_level  a part needs the player's level >= its ItemClient "Req Level" (column 7)
;   part_grade  a part needs the car's V grade >= its ItemClient column 8 (the client's "Required Grade"; 0 in the
;               US tables, filled in the EU ones). EU-only changes stay off for us.*
;   level_points  the player's level adds points to the four stats (the "User" column); the EU version has none
;   half_level_points  those points are level / 2 (the 2008 rule) instead of 1 per level
;   drop_by_grade  traffic / combo / rush drop groups by the current car's V grade (V1 = the drop table's first level
;               row, ... V9 = the ninth) instead of the player's level
;   battle_levels  the battle zone's level limits ([battlezone] section levels, the Pro EXP tiers, invites, Lap Time);
;               off: the car's V grade only (the EU client's own limits: tools/global_content.py --column Value_EU_eng)
us.part_level = 1
us.part_grade = 0
eu.part_level = 0
eu.part_grade = 1
us.level_points = 1
eu.level_points = 0
us.half_level_points = 0
eu.half_level_points = 0
us.drop_by_grade = 0
eu.drop_by_grade = 1
us.battle_levels = 1
eu.battle_levels = 0
;   new_physics  the client's driving model (GlobalContent NEWVEHICLESTAT): 1 new (the US client), 0 old (the EU
;               design). The server cannot switch it: after changing eu.new_physics run
;               `.venv/bin/python tools/eu_client.py physics` (writes the EU client's pack) and restart the EU client
us.new_physics = 1
eu.new_physics = 0

[native]
server_list = server_data/serverlist.txt
; the address sent to clients for serverlist.txt's 127.0.0.1 entries. Empty = the address the client reached (right when
; the emulator runs on the host). The Docker container (docker-compose.yml) sets DCEMU_PUBLIC_HOST=127.0.0.1 for a
; client on the same machine; for players on the network put this machine's address here or in serverlist.txt
public_host =
data = server_data  ; Init/: the 2011 client's .xlt tables; its .tdf tables and city traffic go to server_data/tables (python3 -m tools.sync_data)
; what only the server has (no 2011 version), copied from the 2008 server: server_data/tables (LevelServer.tdf,
; Contents.ini, ItemServer.tdf, drops, rush hours, ...), server_data/*.txt (pvp exp, combo exp, Lap Time, Real Match
; hours), server_data/Localize (server messages); and the admin accounts
server_data = server_data/tables
admin_list = server_data/adminlist.txt
; race traffic in battle zone races (native barea): the TW engine and the 2008 track paths
race_traffic_engine = dcemu/native/tw_traffic.py
race_traffic_data = server_data/race
; days a character waits between "delete" and the actual deletion (2011: the client asks for its
; DeleteCharExpireDays, 3). Empty = what the client asks; 0 = can be deleted at once.
delete_wait_days = 0

[traffic]
; the traffic cars and signals in the cities:
;   city = native   the area service drives them itself (dcemu/native/city_traffic.py), on the 2011 client's lanes
;                   (server_data/tables/<City>/<city>.tcs, from tools/sync_data.py) and car models (TrafficFlowControl.xlt)
;   city = agent    the 2008 server's TrafficAgent.exe sends them: run it from ../Server2008/traffic_agent/
;                   (its docker-compose.yml says how)
;   city = off      no city traffic
; It had Oros's and Cras's lanes swapped: areas 52-61 (Oros) got Cras's traffic, 76-85 (Cras) Oros's.
city = native
; traffic cars per city area (each channel has its own); defaults: what TrafficAgent drove
cars.moonpalace = 300
cars.koinonia = 400
cars.oros = 380
cars.cras = 438
; Mitro City (Taipei, areas 62-75): path traffic on Taipei/Path/path_taipei.chpath (no .tcs), stepped by the race engine
cars.taipei = 400

[battlezone]
; A room with only one player starts a practice run: the track loads, but there is no countdown, no gate
; rewards, no finish and no result (the 2008 server's BattleZone.PracticeMode). 0 = a real race alone.
practice_alone = 1
; AI racers: 1 = the room master's seat button ("AI Vehicles Activated"; 2011 client: GlobalContent BattleRoomAI = 1)
; seats an AI racer, driven by the master's client; races with AIs only on the tracks with the AI icon. 0 = none.
ai = 1
; Real Match (the lobby the client numbers 6: equal stats and parts for every racer, own car model):
;   realmatch = always     open all the time
;   realmatch = schedule   open at the hours of server_data/realmatchtable.txt (lines "weekday hour",
;                          weekday 0 = Sunday, hour 0-24, this machine's local time), each for
;                          realmatch_minutes; outside them Real Match rooms cannot be created or started
;   realmatch = off
; realmatch_effect: the client's Real Match look (a livery and race number per seat), 0 = off, 1-7 =
; the value of the client's switch Etc.RealMatchEffect (what 2-7 select is not known).
realmatch = always
; Lap Time arenas (V1-V9 by the car's grade): 1 = also the 2008 level limit per arena (laptimeinfo.txt)
laptime_level_limit = 0
realmatch_minutes = 60
; realmatch_car: the one car everyone drives in a Real Match room: car type (VehicleList "Unique Id"), grade
; 1-9. Players get it when they enter the room and their own car back when they leave. 0 = own cars.
; The equal stats are those of the same car and grade plus the eight Real Match parts.
realmatch_car = 50, 9
; (set to 0 on 2026-10-15: with 1 the Real Match car had a roof figure with gift boxes the user did not want;
; whether that came from this setting is not confirmed)
realmatch_effect = 0
; Battle zone sections: who may create or join a room there, by the grade of the car driven (V1-V9),
; and the section's exp multiplier. No level limits on the server side.
;   section.<PvP channel id> = name, lowest grade, highest grade, exp multiplier
; and optionally ", lowest level, highest level" at the end of a line (a server-side level limit, checked
; like the car grade when a room is created or joined; none when left out), e.g.
;   section.0 = Amateur, 1, 3, 2, 1, 20
; The channel id is what the client sends when it opens a section's lobby: 0 Amateur (2X), 1 Rookie
; (3X), 2 Pro (4X), 3 Star (6X), 4 SuperStar (8X), 5 Free (0 and 5 seen in the logs and confirmed by
; the user; the 2008 server's pvpexprate.txt has the multipliers in the same order).
; The client decides by itself which section buttons a player can press, from its own table
; GlobalContent.xlt (MinBattle2XGrade / MaxBattle2XGrade / MaxBattle2XLevel ... per section): the car
; grades there are the same as below, and it also has level caps (Amateur 20, Rookie 40, Pro 70).
; A section without a line here has no car limit and exp x1.
section.0 = Amateur, 1, 3, 2
section.1 = Rookie, 3, 5, 3
section.2 = Pro, 4, 6, 4
section.3 = Star, 6, 8, 6
section.4 = SuperStar, 8, 9, 8
section.5 = Free, 1, 9, 2
section.6 = Real Match, 1, 9, 2
; the 2011 battle zone (BattleZoneReform, sent as 1) has three buttons: 11 Newbie, 12 Pro, 6 Real Match; the
; car / level limits as the client's GlobalContent.xlt (MinBattleNEWBIEGrade ... MaxBattlePROLevel)
; (Newbie: the button says EXP x3; Pro: the room's tier sets the multiplier and the limits, rooms.PRO_TIERS)
section.11 = Newbie, 1, 5, 3, 1, 30
section.12 = Pro, 1, 9, 4, 11, 1000
; EU players (nation rule battle_levels off: no level limits; the EU client's GlobalContent.xlt Value_EU_eng has the
; same grades): eu.section.<channel> in place of section.<channel>; the Pro tiers for EU are rooms.PRO_TIERS_EU
; (4X V4-5, 6X V6, 8X V7-8, 16X V9)
eu.section.11 = Newbie, 1, 3, 3
eu.section.12 = Pro, 4, 9, 4

[championship]
; The GT Championship (the battle zone's tournament: classes Rookie (level 70 or lower), Touring B / A (speed caps), GT
; Master; game/championship.py has the rules). GM: gmtour start [minutes] | next | end | status | test on|off.
enabled = 1
; schedule: when it starts by itself, "weekday HH:MM" entries (sun .. sat or * for every day, this machine's local
; time), comma separated, e.g. "sat 20:00, wed 21:30"; empty = only with gmtour start
schedule =
; minutes (the client's content flags: it counts down with them): the preliminaries, the entry window before each
; later round's races, the quarter-finals' races, the semi-finals' / finals' two races
pre = 30
wait = 3
main = 8
final = 10
; a class needs this many players with a preliminary record, else it is cancelled (the client's text says 8)
min_players = 8
; the Touring classes' speed caps in km/h, as the client applies them (GlobalContent PvpGT_TouringA / B); only used for
; the client's texts (US clients get mph)
touring_a = 361
touring_b = 341
; the tracks (PVPTrackInfo Id) of the preliminaries, quarter-finals 1, 2, semi-finals and finals; map_flag 0x04 = no
; traffic (0x08 light, 0x10 normal, 0x20 heavy)
maps = 0, 1, 2, 3, 4
map_flag = 0x04
; prizes for the finals' ranks, by message: reward.<class>.<rank> = Mito[, item id[, count]]; class 7 Rookie,
; 8 Touring B, 9 Touring A, 10 GT Master (these are the defaults)
reward.7.1 = 100000
reward.7.2 = 50000
reward.7.3 = 30000
reward.8.1 = 200000
reward.8.2 = 100000
reward.8.3 = 50000
reward.9.1 = 300000
reward.9.2 = 150000
reward.9.3 = 80000
reward.10.1 = 500000
reward.10.2 = 250000
reward.10.3 = 100000

[cbattle]
; the crews' channel battles (dcemu/native/game/channels.py; the crew window's Channel Battle). Weekly at Contents.ini
; CBattleDay (0 = Sunday) / CBattleHour (UTC); day / hour here override them (-1 = Contents.ini's)
day = -1
hour = -1
; registration opens this many minutes before the battle; the battle lasts battle_minutes
open_minutes = 10
battle_minutes = 60
; channels: 10 normal (1-2 Major, 3-10 Minor) + Semi-channels (13 = 3 Semi-channels)
channels = 13
; entry rules: main = the normal channels, semi.N = Semi-channel N: max level, min car grade, max car grade (0 = no
; limit). A Semi-channel without a line is closed to that nation. US: the 2008 levels (client text 11411)
main = 0, 0, 0
semi.1 = 40, 0, 0
semi.2 = 60, 0, 0
semi.3 = 70, 0, 0
; EU (user, 2026-10-18): no level limits, Semi-channel 1 up to V3, 2 up to V6; normal channels V6 and up (the EU client's
; own design). After changing the eu. lines run `.venv/bin/python tools/eu_client.py cbattle` (the EU client checks the
; minimum grades itself and shows the rules in its texts) and restart the EU client
eu.main = 0, 6, 0
eu.semi.1 = 0, 1, 3
eu.semi.2 = 0, 1, 6
; challengers need a Challenge Coupon (i_n_00037), used up when their first round starts (1 = on)
coupon = 1
; Major channels (1-2): each racer's crew puts one random part of the car it races with at stake in the match's first
; round; the losing crew's parts are taken and sent to the winning crew's master as a message with the part attached
; (the 2008 server's rule; the client warns of it, text 10553). 1 = on, 0 = off. GM: gmcbattle stakes on | off
major_stakes = 0
; replays: every round is recorded (Emulator/replays/); how many to keep (oldest go first; 0 = all). Watching one costs
; 1000 Mito (Major) / 500 (Minor), free on Semi-channels or with the Ch. Battle Replay Pass (the client's prices)
replays = 200
; a defence win pays the defending crew's master this much Mito per attacking racer (2008: 5000)
defence_reward = 5000
; tax: % of every Mittron refuel payment to each channel's owner: Major, Minor (1st / 2nd / 3rd+ week in a row),
; Semi-channels 1, 2, 3 (the client's texts); paid to the crew master once a day at tax_hour (local time)
tax_major = 10
tax_minor = 3, 4, 5
tax_semi = 1, 1, 1.5
tax_hour = 6
; test mode (1 = for everyone; per character the GM chat command  gmcbtest on | off): one player can attack a channel
; alone. No Challenge Coupon or crew rank needed, the crew room queues at once (no Ready), and a test crew alone against
; an owner that has no room attacks by itself: finishing a round wins it, 2 wins take the channel.
; GM: gmcbattle now [minutes to the battle] [battle minutes] | end | owner <channel> <crew name | test | none> | status
test = 0

[items]
; drift shop drinks while held: % more exp / Mito from play (races, combos, missions, jobs, chases, rush,
; lap time; not quests)
drink_exp = 30
drink_mito = 50
; option parts (op_S / op_C / op_A / op_B / op_F): 1 = they can be equipped on a part's slot, 0 = not (the
; official 2011 server had them off). Sent to the client as Main.OptionItem.
option_parts = 0
; docking parts: 1 = combining three parts (+ a seed) into a docking part and docking it onto a part
; (Main.DockingItem), 0 = off
docking_parts = 1
; Perfect Base (PB): 1 = a part from a drop or reward (traffic / chase pickups, quest / job / mission rewards, drift
; packs, gift boxes) gets a random base bonus of ItemClient column 10 .. column 11 points on its table value, as the
; 2008 server (XiCsCharInfo::TakeItem -> ItemRandValue: uniform, both ends included); the perfect base is the table
; value + column 11. Parts bought in the parts shop get no bonus (2008 BuyItem: 0). 0 = every part at its table value.
random_base = 1
; days after a name change (Driver's Name Change Kit) before the character can be renamed again (the kit's
; text: 60); 0 = no wait
rename_days = 60
; part enhancing (Modify tab): the success % of a try (2008 table, per grade and level) times this with a Mittron
; Enhancer PLUS / DELUXE (any grade's PLUS / DELUXE; capped at 100 %); the break % stays the table's
enhancer_plus = 1.5
enhancer_deluxe = 2.0
; 2016 Ultra parts (grade U): the odds table stops at Hyper, so a U part is enhanced with the Hyper success % times
; this (the break % stays Hyper's; a guess, nothing measured). No effect on the 2011 client (it has no U parts)
ultra_odds = 1.0

[vshop]
; drift shop (F4) rows (VShopItem UniqueIds) changed from the 2011 table. After changing this section: run
; `.venv/bin/python tools/shop_rows.py apply` (writes it into both clients' VShopItem; restart the clients) and
; restart the emulator.
; hidden: rows taken off sale: the server refuses to sell or gift them; in the clients SellStage 99 (not listed).
; 20204-20210: the harvest event (Delivery Box Recipe, Normal / Ice Box, Fresh Vegetable / Fish / Fruit / Meat)
hidden = 20204, 20205, 20206, 20207, 20208, 20209, 20210
; sell.<UniqueId> = column=value, ...: VShopItem columns set for that row (SellStage 1 = listed; prices: Use Mito /
; UseHancoin, Period 7D / $Price 7D (G Coin) / Mito Price7D, ... as in the table's header).
; 10820 PassiveAssist(DriftBooster) passive_a_00118 (assist a_00118 Post-Drift Booster; goes on the car:
; driftuse.EQUIP_PASSIVE): not sold in 2011 (no price), now G Coin like the Fuel Booster (user, 2026-10-18)
sell.10820 = SellStage=1, Use Mito=0, UseHancoin=1, Period 7D=7, $Price 7D=100, Period 30D=30, $Price 30D=250, Period 90D=90, $Price 90D=500

[vchase]
; Virtual HUV (dcemu/native/game/vchase.py; the Tatiana Call Unit in a city, 4:4 or 8:8). From the JP wiki: the match
; seconds, hits that catch a HUV (33 % each), points for a catch, the HUV's HP loss every 10 s (and every 10 s
; while 1500 m or more from its team's next HUV, the client tells), a HUV's traffic hit: points and HP back
seconds_4 = 300
seconds_8 = 600
hits = 3
catch_points = 20
drain = 5
traffic_points = 3
traffic_heal = 5
; rewards (the wiki gives no amounts): exp / Mito = a HUV's exp / Mito at the player's level (HuvTable) x these, x 2 in
; 8:8; the winners also get Undercity 120%, Mittron Enhancers by city and (Team ROO) 10 HUV Call Units
win_rate = 30
lose_rate = 10
; test mode: a match starts with two players waiting (any size), one per team, one HUV at a time that goes to the
; other player when it is out. 1 = for everyone; or per character with the GM chat command  gmvchasetest on | off
test = 0

[undercity]
; the Undercity (dcemu/native/game/undercity.py; Tatiana, a party of 2-4, four missions; the 2008 server's rules).
; test mode: one player can enter alone with the chat command /ucm (/uck, /ucc, /uco: Moon Palace, Koinonia, Cras,
; Oros; Tatiana's dialog itself refuses a party of one in the client), free, with a 2-player party's barrier HUBs in
; Mission 2. 1 = for everyone; or per character with the GM chat command  gmuctest on [phase] | off
test = 0
; test mode: the mission a run starts at (the ones before it are skipped and give nothing): 1 Mission 1 (HUBs),
; 2 Mission 2 (barrier HUBs + main HUB), 3 Mission 3 (HUV waves), 4 Mission 4 (BossHUV). Per character: gmuctest on N
test_phase = 1
; a cleared run's rewards for each member: one random part of the city's set (Moon Palace Kayla / Yuki, Koinonia
; Hyeyoung / Erina, Cras Duffy / Mr. H, Oros Yahn / Branton): the Beta set (H) from this class up (5 S, 4 A, 3 B,
; 2 C, 1 D; the result window shows S as A), else the Alpha set (S); and the item `enhancer`, as many as
; `enhancers` gives for the class (D, C, B, A, S)
beta_class = 4
enhancer = i_n_00003
enhancers = 1, 1, 2, 3, 3

[auction]
; the Auction House (dcemu/native/game/auction.py). Listings run for `days` days (the game's 7); a listing not sold by
; then expires: it leaves the public lists and the seller takes the item back from their list (Cancel). Fees (% of the
; price, at least 1 Mito) are taken when a listing is registered and not given back; the client shows the item and
; drift item fees from these values.
days = 7
; the lowest character level that can register or buy
min_level = 1
item_fee = 7
; cars: 1 = cars can be registered and bought (the client's car auction "open"), 0 = closed. Listings made before
; stay in their sellers' lists (they can take the car back or collect the money).
cars = 1
car_fee = 10
; drift items: 1 = drift shop items bought with G Coin can be registered and bought, 0 = off. The client shows its
; drift item tab only with AuctionVSItem = 1 in its GlobalContent.xlt, and the US client's UI layout has no such tab
; (tried 2026-10-14: the column titles went blank; reverted to 0). Kept for a client whose UI has it.
drift_items = 0
drift_fee = 10

[daymission]
; the daily mission (Mission Girl Suyeon, a Mission Token per day): the hour (local time) a new mission day starts
reset_hour = 0

[instant]
; instant missions offered while driving in the city (the 2011 call-sign notice, TAB to accept; the client shows it
; only with its "Show instant messages" option on): every this many minutes when no mission is running; 0 = off.
; (Request house "Instant Quest" offers come on request.)
city_offer_minutes = 1

[partypatrol]
; Party Patrol (a party's shared patrol with a time limit; dcemu/native/game/partypatrol.py). Seconds at the start
; (the wiki: 60), and every bonus_posts posts of the party add bonus_seconds (a guess)
start_seconds = 60
bonus_posts = 5
bonus_seconds = 4
; an emergency post taken adds quick_max_seconds, one less every quick_decay_seconds it waited, at least
; quick_min_seconds; its exp = quick_exp x the patrol's exp per post (guesses)
quick_max_seconds = 20
quick_min_seconds = 5
quick_decay_seconds = 3
quick_exp = 10
; the patrol fails this many seconds after its time is up (lag)
grace_seconds = 2
; test mode: a player alone who accepts a patrol at a pillar gets that city's party patrol, with test_start_seconds
; to start. 1 = for everyone; or per character with the GM chat command  gmpartytest on | off
test = 0
test_start_seconds = 600

[gotcha]
; the Gotcha machine (capsule boxes, main menu button): 1 = on, 0 = off (the button is hidden)
enabled = 1
; the newest season the machine offers (the client's car seasons: 1 Shadow, 2 Hunter, 5 Shadow, 6 Hunter, 7 Fate,
; 8 Monza, 9 Winner, 10 Rosso, 11 Raptor, 12 Ponica, 13 Allied; its own table shows up to 13)
season = 13
; prices per capsule; 0 = the client's own (Mito 10000; G Coin by season, 190-540)
mito_price = 0
coin_price = 0

[rush]
; Rush time. schedule = 1: rushes start at the hours of server_data/tables/rushtimetable.txt (2008 format:
; "weekday hour HUV type", weekday 0 = Sunday; the 2008 table has every hour), with the 9..1 minute notices.
schedule = 1
; always = 1 (2011 City.AlwaysRushTime): besides the timetable, a city gate's rush zone with start_members or more
; players starts a rush countdown seconds later (the client says "in 1 min"); one rush per city and gate at a time
always = 1
start_members = 2
countdown = 60
; TESTING (user, 2026-10-15): every rush boss and boss part dies in this many hits (the damage is scaled, the
; health stays the client's so Lil' Grimer / the baby dozers still come out); 0 = normal
test_health = 0

[mita500]
; Mita 500 bottles in the cities (2008 server; off there): driving over one offers the salesperson's drink, a
; Mito buff (150 / 200 / 250 %, 500 % at 1 in lucky_rate on the 3rd step below level 71; 150 % from level 71),
; at most 3 drinks a day, not together with a Bacchus. bottles per city area (1-16), regen_sec until a taken
; bottle shows again, buff_sec the buff's length, fee Mito per drink. Off for now (user, 2026-10-18)
enabled = 0
bottles = 10
regen_sec = 300
buff_sec = 1800
fee = 500
lucky_rate = 10

[mail]
; messages (Communication Zone): the lowest character level that can send a message (1 = everyone)
min_level = 1
; Mito taken per message sent (the client shows it as the message's cost)
fee = 0

[stickers]
; who may upload new stickers: all, or gm (the accounts in adminlist.txt)
upload = all
; stickers one character may upload per day; 0 = no limit
daily_limit = 6
; players report a sticker by typing "/report <sticker name> [reason]" in chat; GMs: gmreports,
; gmbadsticker <name> (blocks it everywhere), gmgoodsticker <name>

[flags]
; Content flags (the client's feature switches, sent at login) set by their 2011 name, over Contents.ini.
; Main.Apprentice defaults to 1: Driver Dome training for new characters in both builds.
; Set Main.Apprentice = 0 here to keep the original starter/field tutorial creation flow.
; Main.MainButtonAdvanced defaults to 2: show the classic / ADV HUD selector in Video options (2011 and 2016).
; BattleZone.FrontAi (0-15): only the AI racers' grid places (2011 0x776634 / 0x77b3cf, 2016 0x7d43a4 / 0x7d93ff):
; not 0 = the AIs start in front of the players (slot = seat - (8 * value + 16)); 0 = by seat, with the players
; (user, 2026-10-20). The AI racers themselves: [battlezone] ai.
BattleZone.FrontAi = 0
; Manufacturing (skill books, the manufacturing window on K, the manufacturing shop in the Driver Dome; game/
; alchemy.py): the client hides all of it unless this is 1 or more (its checks: flags +0x274 & 0x60000 >= 0x20000)
Main.ManufacturingSystem = 1
; Taipei (Metro City): Contents.ini (from the 2008 server, which had no Taipei) leaves it off, so the battle zone's
