[emulator]
listen = 0.0.0.0        ; where the 2011 client connects
upstream = 127.0.0.1    ; only for proxied services: the 2008 ZoneServer (../Server2008, not needed when all are native)
log_dir = logs
control_port = 11099   ; GM commands, 127.0.0.1 only (tools/gmctl.py: kick, block, ban); 0 = off

[services]
; name = client port, ZoneServer port, handshake bytes per direction (a 56-byte key
; exchange on auth/lobby/game/ranking, none on area/barea; see dcemu/protocol.py)
; the client ports are the ones the 2011 client and server_data/serverlist.txt use
; native (the emulator is the server): ZoneServer port 0
auth  = 11005 0 56
lobby = 11011 0 56
game  = 11021 0 56
area  = 11031 0 0
barea = 11041 0 0
ranking = 11051 0 56
; proxied to the 2008 server instead: auth = 11005 12005 56, lobby = 11011 12011 56
; native barea with race traffic (dcemu/native/race.py, not yet tried with the real client): barea = 11041 0 0

[database]          ; SQL Server (docker-compose.yml here: service db, published on 127.0.0.1:14330)
host = 127.0.0.1
port = 14330
user = sa
password = z0ne!server
name = SKDBTW
server_id = 100

[auth]
; 1 = logging in with an ID that has no account creates the account with the password typed (not empty;
; IDs: 1-32 characters, letters, digits and - _ .), 0 = unknown IDs are refused ("ID does not exist")
auto_register = 1

[native]
server_list = server_data/serverlist.txt
data = server_data  ; Init/: the 2011 client's .xlt tables; its .tdf tables and city traffic go to server_data/tables (python3 -m tools.sync_data)
; what only the server has (no 2011 version), copied from the 2008 server: server_data/tables (LevelServer.tdf,
; Contents.ini, ItemServer.tdf, drops, rush hours, ...), server_data/*.txt (pvp exp, combo exp, Lap Time, Real Match
; hours), server_data/Localize (server messages); and the admin accounts
server_data = server_data/tables
admin_list = server_data/adminlist.txt
; race traffic in battle zone races (native barea): the TW engine and the 2008 track paths
race_traffic_engine = dcemu/native/tw_traffic.py
race_traffic_data = server_data/race
; days a character waits between "delete" and the actual deletion (2011: the client asks for its
; DeleteCharExpireDays, 3). Empty = what the client asks; 0 = can be deleted at once.
delete_wait_days = 0

[traffic]
; the traffic cars and signals in the cities:
;   city = native   the area service drives them itself (dcemu/native/city_traffic.py), on the 2011 client's lanes
;                   (server_data/tables/<City>/<city>.tcs, from tools/sync_data.py) and car models (TrafficFlowControl.xlt)
;   city = agent    the 2008 server's TrafficAgent.exe sends them: run it from ../Server2008/traffic_agent/
;                   (its docker-compose.yml says how)
;   city = off      no city traffic
; It had Oros's and Cras's lanes swapped: areas 52-61 (Oros) got Cras's traffic, 76-85 (Cras) Oros's.
city = native
; traffic cars per city area (each channel has its own); defaults: what TrafficAgent drove
cars.moonpalace = 300
cars.koinonia = 400
cars.oros = 380
cars.cras = 438
; Mitro City (Taipei, areas 62-75): path traffic on Taipei/Path/path_taipei.chpath (no .tcs), stepped by the race engine
cars.taipei = 400

[battlezone]
; A room with only one player starts a practice run: the track loads, but there is no countdown, no gate
; rewards, no finish and no result (the 2008 server's BattleZone.PracticeMode). 0 = a real race alone.
practice_alone = 1
; Real Match (the lobby the client numbers 6: equal stats and parts for every racer, own car model):
;   realmatch = always     open all the time
;   realmatch = schedule   open at the hours of server_data/realmatchtable.txt (lines "weekday hour",
;                          weekday 0 = Sunday, hour 0-24, this machine's local time), each for
;                          realmatch_minutes; outside them Real Match rooms cannot be created or started
;   realmatch = off
; realmatch_effect: the client's Real Match look (a livery and race number per seat), 0 = off, 1-7 =
; the value of the client's switch Etc.RealMatchEffect (what 2-7 select is not known).
realmatch = always
; Lap Time arenas (V1-V9 by the car's grade): 1 = also the 2008 level limit per arena (laptimeinfo.txt)
laptime_level_limit = 0
realmatch_minutes = 60
; realmatch_car: the one car everyone drives in a Real Match room: car type (VehicleList "Unique Id"), grade
; 1-9. Players get it when they enter the room and their own car back when they leave. 0 = own cars.
; The equal stats are those of the same car and grade plus the eight Real Match parts.
realmatch_car = 50, 9
; (set to 0 on 2026-10-15: with 1 the Real Match car had a roof figure with gift boxes the user did not want;
; whether that came from this setting is not confirmed)
realmatch_effect = 0
; Battle zone sections: who may create or join a room there, by the grade of the car driven (V1-V9),
; and the section's exp multiplier. No level limits on the server side.
;   section.<PvP channel id> = name, lowest grade, highest grade, exp multiplier
; and optionally ", lowest level, highest level" at the end of a line (a server-side level limit, checked
; like the car grade when a room is created or joined; none when left out), e.g.
;   section.0 = Amateur, 1, 3, 2, 1, 20
; The channel id is what the client sends when it opens a section's lobby: 0 Amateur (2X), 1 Rookie
; (3X), 2 Pro (4X), 3 Star (6X), 4 SuperStar (8X), 5 Free (0 and 5 seen in the logs and confirmed by
; the user; the 2008 server's pvpexprate.txt has the multipliers in the same order).
; The client decides by itself which section buttons a player can press, from its own table
; GlobalContent.xlt (MinBattle2XGrade / MaxBattle2XGrade / MaxBattle2XLevel ... per section): the car
; grades there are the same as below, and it also has level caps (Amateur 20, Rookie 40, Pro 70).
; A section without a line here has no car limit and exp x1.
section.0 = Amateur, 1, 3, 2
section.1 = Rookie, 3, 5, 3
section.2 = Pro, 4, 6, 4
section.3 = Star, 6, 8, 6
section.4 = SuperStar, 8, 9, 8
section.5 = Free, 1, 9, 2
section.6 = Real Match, 1, 9, 2
; the 2011 battle zone (BattleZoneReform, sent as 1) has three buttons: 11 Newbie, 12 Pro, 6 Real Match; the
; car / level limits as the client's GlobalContent.xlt (MinBattleNEWBIEGrade ... MaxBattlePROLevel)
; (Newbie: the button says EXP x3; Pro: the room's tier sets the multiplier and the limits, rooms.PRO_TIERS)
section.11 = Newbie, 1, 5, 3, 1, 30
section.12 = Pro, 1, 9, 4, 11, 1000

[items]
; drift shop drinks while held: % more exp / Mito from play (races, combos, missions, jobs, chases, rush,
; lap time; not quests)
drink_exp = 30
drink_mito = 50
; option parts (op_S / op_C / op_A / op_B / op_F): 1 = they can be equipped on a part's slot, 0 = not (the
; official 2011 server had them off). Sent to the client as Main.OptionItem.
option_parts = 0
; docking parts: 1 = combining three parts (+ a seed) into a docking part and docking it onto a part
; (Main.DockingItem), 0 = off
docking_parts = 1
; days after a name change (Driver's Name Change Kit) before the character can be renamed again (the kit's
; text: 60); 0 = no wait
rename_days = 60
; part enhancing (Modify tab): the success % of a try (2008 table, per grade and level) times this with a Mittron
; Enhancer PLUS / DELUXE (any grade's PLUS / DELUXE; capped at 100 %); the break % stays the table's
enhancer_plus = 1.5
enhancer_deluxe = 2.0

[auction]
; the Auction House (dcemu/native/game/auction.py). Listings run for `days` days (the game's 7); a listing not sold by
; then expires: it leaves the public lists and the seller takes the item back from their list (Cancel). Fees (% of the
; price, at least 1 Mito) are taken when a listing is registered and not given back; the client shows the item and
; drift item fees from these values.
days = 7
; the lowest character level that can register or buy
min_level = 1
item_fee = 7
; cars: 1 = cars can be registered and bought (the client's car auction "open"), 0 = closed. Listings made before
; stay in their sellers' lists (they can take the car back or collect the money).
cars = 1
car_fee = 10
; drift items: 1 = drift shop items bought with G Coin can be registered and bought, 0 = off. The client shows its
; drift item tab only with AuctionVSItem = 1 in its GlobalContent.xlt, and the US client's UI layout has no such tab
; (tried 2026-10-14: the column titles went blank; reverted to 0). Kept for a client whose UI has it.
drift_items = 0
drift_fee = 10

[daymission]
; the daily mission (Mission Girl Suyeon, a Mission Token per day): the hour (local time) a new mission day starts
reset_hour = 0

[instant]
; instant missions offered while driving in the city (the 2011 call-sign notice, TAB to accept; the client shows it
; only with its "Show instant messages" option on): every this many minutes when no mission is running; 0 = off.
; (Request house "Instant Quest" offers come on request.)
city_offer_minutes = 5

[gotcha]
; the Gotcha machine (capsule boxes, main menu button): 1 = on, 0 = off (the button is hidden)
enabled = 1
; the newest season the machine offers (the client's car seasons: 1 Shadow, 2 Hunter, 5 Shadow, 6 Hunter, 7 Fate,
; 8 Monza, 9 Winner, 10 Rosso, 11 Raptor, 12 Ponica, 13 Allied; its own table shows up to 13)
season = 13
; prices per capsule; 0 = the client's own (Mito 10000; G Coin by season, 190-540)
mito_price = 0
coin_price = 0

[rush]
; Rush time. schedule = 1: rushes start at the hours of server_data/tables/rushtimetable.txt (2008 format:
; "weekday hour HUV type", weekday 0 = Sunday; the 2008 table has every hour), with the 9..1 minute notices.
schedule = 1
; always = 1 (2011 City.AlwaysRushTime): besides the timetable, a city gate's rush zone with start_members or more
; players starts a rush countdown seconds later (the client says "in 1 min"); one rush per city and gate at a time
always = 1
start_members = 2
countdown = 60
; TESTING (user, 2026-10-15): every rush boss and boss part dies in this many hits (the damage is scaled, the
; health stays the client's so Lil' Grimer / the baby dozers still come out); 0 = normal
test_health = 0

[mita500]
; Mita 500 bottles in the cities (2008 server; off there): driving over one offers the salesperson's drink, a
; Mito buff (150 / 200 / 250 %, 500 % at 1 in lucky_rate on the 3rd step below level 71; 150 % from level 71),
; at most 3 drinks a day, not together with a Bacchus. bottles per city area (1-16), regen_sec until a taken
; bottle shows again, buff_sec the buff's length, fee Mito per drink
enabled = 1
bottles = 10
regen_sec = 300
buff_sec = 1800
fee = 500
lucky_rate = 10

[mail]
; messages (Communication Zone): the lowest character level that can send a message (1 = everyone)
min_level = 1
; Mito taken per message sent (the client shows it as the message's cost)
fee = 0

[stickers]
; who may upload new stickers: all, or gm (the accounts in adminlist.txt)
upload = all
; stickers one character may upload per day; 0 = no limit
daily_limit = 6
; players report a sticker by typing "/report <sticker name> [reason]" in chat; GMs: gmreports,
; gmbadsticker <name> (blocks it everywhere), gmgoodsticker <name>

[flags]
; Content flags (the client's feature switches, sent at login) set by their 2011 name, over Contents.ini.
; Experiment (2026-10-13): BattleZone.FrontAi (0-15) is the only AI switch the client has; the client
; treats room members with a serial above 0xffff as AI racers. What a value other than 0 does is not
; known yet: try e.g. 1, restart the emulator, log in again and open a race room.
BattleZone.FrontAi = 0
; Manufacturing (skill books, the manufacturing window on K, the manufacturing shop in the Driver Dome; game/
; alchemy.py): the client hides all of it unless this is 1 or more (its checks: flags +0x274 & 0x60000 >= 0x20000)
Main.ManufacturingSystem = 1
; Taipei (Metro City): Contents.ini (from the 2008 server, which had no Taipei) leaves it off, so the battle zone's
; fifth city button stayed blank and its tracks (PVPTrackInfo ids 91 / 92) were not offered (user, 2026-10-16).
; May also open the city itself in places; the city has no native traffic yet. 0 = off again.
City.Taipei = 1
; Driver Dome lower floor (B1): Contents.ini has it off (the 2008 TW setting). Test 2026-10-16: a ROO character
; (guild type 1, after "First Task from ROO") stayed on "loading data" at login; the client's ROO checks sit in the
; dome code, so B1 may be the ROO floor: tried, still stuck; back to 0.
OMDBase.FloorB1 = 0
