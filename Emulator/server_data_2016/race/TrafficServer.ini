[Traffic]
;Race traffic emulator (tools/traffic_server.py). Read at the start of every race,
;so changes apply to the next race without a restart.

;Mode=emulate: the emulator adds the race traffic (default).
;Mode=native: ZoneServer runs its own race traffic (needs the .index and .signal files from
;tools/make_traffic_paths.py and tools/make_traffic_signals.py); the relay only logs it.
;The other settings below apply to emulate only.
Mode=native

;Car top speed in km/h: each group of cars gets a random top speed between SpeedMin
;and SpeedMax. Set both to the same value for a fixed speed. The reference server uses
;about 50-140.
SpeedMin=50
SpeedMax=140

;Amount of traffic for each level chosen in the room options, in cars per km of road.
;Tracks have 19-96 km of traffic road, so this scales with the track. Total cars are
;also limited by the first line of trafficCarSettingForTrack_N.txt (500).
;Calibrated against the reference server on Moon Palace: about 7, 14 and 19 cars within
;view (320 m) on average for low, medium and high.
;Halved on 2026-10-16 (user: battle zone traffic too dense; was 1.7 / 3.6 / 4.8).
CarsPerKmABit=0.85
CarsPerKmMedium=1.8
CarsPerKmALot=2.4
